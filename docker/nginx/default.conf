server {
    listen 80;
    server_name _;
    root /var/www/app/public;
    index index.php;
    server_tokens off;
    client_max_body_size 26m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        internal;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        if ($uri !~ ^/index\.php$) { return 404; }
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_intercept_errors on;
        fastcgi_pass app:9000;
    }

    location ~ /\. {
        deny all;
    }

    location = /assets/app.css {
        try_files $uri =404;
        default_type text/css;
    }
}
