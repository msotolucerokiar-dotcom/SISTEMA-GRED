services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/app
    volumes:
      - ./:/var/www/app
      - private_uploads:/var/www/app/storage/private
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET:-local-only-change-before-deploy}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-gred_support}
      DB_USER: ${DB_USER:-gred_app}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-local}
      SESSION_SECURE: ${SESSION_SECURE:-0}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-lc", "mkdir -p storage/private && chown -R www-data:www-data storage/private && composer install --no-interaction && php bin/migrate.php && php-fpm -F"]
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-gred_support}
      POSTGRES_USER: ${DB_USER:-gred_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gred_app} -d ${DB_NAME:-gred_support}"]
      interval: 5s
      timeout: 5s
      retries: 10

  tailwind:
    image: node:20-alpine
    working_dir: /var/www/app
    volumes:
      - ./:/var/www/app
    command: ["sh", "-lc", "npm install --prefix /tmp/asset-build --no-save --no-audit --no-fund tailwindcss@^3.4.17 gsap@^3.15.0 && /tmp/asset-build/node_modules/.bin/tailwindcss -c ./tailwind.config.js -i ./src/Presentation/Assets/css/app.css -o ./public/assets/app.css --minify && cp /tmp/asset-build/node_modules/gsap/dist/gsap.min.js ./public/assets/gsap.min.js && cp /tmp/asset-build/node_modules/gsap/dist/ScrollTrigger.min.js ./public/assets/ScrollTrigger.min.js"]
    profiles: ["assets"]

volumes:
  postgres_data:
  private_uploads:
